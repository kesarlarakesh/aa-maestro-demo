# Hotel Search - Execute Search - Mobile (iOS & Android)
# Performs the hotel search

appId: ${APPID}
name: Search Page - Execute Search (Mobile)

---
- evalScript: ${console.log('Executing hotel search...')}

- tapOn: Search

- extendedWaitUntil:
    visible: randText
    optional: true
    timeout: ${DEFAULT_TIMEOUT}

- evalScript: ${console.log('Search completed, loading results')}
