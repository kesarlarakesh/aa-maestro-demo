# Hotel Search - Select Dates - Mobile (iOS & Android)
# Selects check-in and check-out dates

appId: ${APPID}
name: Search Page - Select Dates (Mobile)

---
- evalScript: ${console.log('Selecting check-in and check-out dates')}

- tapOn: Check-in date.*

- tapOn: '17'

- tapOn: '20'

- tapOn: Confirm

- evalScript: ${console.log('Checkin & Checkout dates are selected')}
